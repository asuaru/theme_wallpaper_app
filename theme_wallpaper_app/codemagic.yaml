workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 20
    environment:
      flutter: stable
      android_signing:
        use_keystore: false
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
