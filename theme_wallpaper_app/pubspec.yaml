name: theme_wallpaper_app
description: A Flutter app that changes wallpaper based on system theme.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^5.2.5
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.2
  wallpaper_manager_flutter: ^0.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/